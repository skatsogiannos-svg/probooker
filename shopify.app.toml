# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration
#
# TODO before App Store submission: replace the client_id, application_url,
# redirect_urls and [app_proxy].url placeholders with the production values.
name = "ProBooker"
handle = "probooker"
client_id = "f804159ae70a76a4a3d0005a3e63fac3"
application_url = "https://probooker.onrender.com"
embedded = true

[access_scopes]
# Least-privilege: the app reads products to turn them into bookable services.
# No customer/order scopes are requested because bookings and customers are
# stored in the app's own database.
scopes = "read_products,write_app_proxy"

[auth]
redirect_urls = [
  "https://probooker.onrender.com/auth/callback",
  "https://probooker.onrender.com/auth/shopify/callback",
  "https://probooker.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

# Single endpoint that dispatches every topic (app/routes/webhooks.tsx).
[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app_subscriptions/update"]
uri = "/webhooks"

# Mandatory GDPR/compliance webhooks — required for App Store review.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks"

# App proxy: the storefront widget calls /apps/booking/* on the shop domain,
# which Shopify forwards (signed) to this app. Avoids CORS and keeps the
# storefront origin same-origin.
[app_proxy]
url = "https://probooker.onrender.com"
subpath = "booking"
prefix = "apps"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
