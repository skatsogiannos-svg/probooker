services:
  - type: web
    name: probooker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: probooker-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: "read_products"
      - key: SESSION_SECRET
        sync: false
      - key: SUPPORT_EMAIL
        value: "b2apps.dev@gmail.com"
      - key: SHOPIFY_BILLING_TEST
        value: "true"

databases:
  - name: probooker-db
    plan: free
    databaseName: probooker
    user: probooker
